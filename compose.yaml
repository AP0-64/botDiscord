services:
  bottoadette:
    build: .
    image: bottoadette:latest
    container_name: bottoadette
    restart: unless-stopped        # relance auto après crash ou redémarrage du NAS
    volumes:
      - ./.env:/app/.env:ro        # token Discord, jamais copié dans l'image
    environment:
      TZ: Europe/Paris
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
